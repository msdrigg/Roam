[package]
name = "roam-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "^1", features = [
    "macros",
    "rt-multi-thread",
    "tracing",
    "signal",
    "fs",
    "io-util",
    "process",
    "sync",
] }
serde = { version = "^1", features = ["derive"] }
dotenvy = "^0.15"
futures = "^0.3"
anyhow = "^1"
uuid = "^1.23"
base64 = "^0.23"
chrono = { version = "^0.4", default-features = false, features = ["serde"] }
ahash = "^0.8"
thiserror = "^2"
# `unbounded_depth` lets the MetricKit parser lift serde_json's 128-deep
# recursion cap. Crash payloads nest one JSON level per stack frame, so the
# cap rejected exactly the deep-stack crashes we most need to read. See
# `parse_metrickit_payload`.
serde_json = { version = "^1", features = ["unbounded_depth"] }
regex = "^1.12"
object = { version = "0.40.0", default-features = false, features = ["read"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }

clap = { version = "^4.5", features = ["derive", "env"] }
clap_derive = { version = "^4.5" }

# Apple Push Notification client. Uses the maintained `apns-h2` fork (rustls 0.23 +
# aws-lc-rs) rather than the unmaintained `a2` crate, which dragged in the vulnerable
# rustls-webpki 0.102 via rustls 0.22. Aliased as `a2` so call sites stay unchanged.
a2 = { package = "apns-h2", git = "https://github.com/threema-ch/apns-h2", tag = "v0.11.0", default-features = false, features = [
    "aws-lc-rs",
    "tracing",
] }
reqwest = { version = "^0.12", default-features = false, features = [
    "json",
    "multipart",
    "rustls-tls",
] }
# serenity 0.12 still pins tungstenite 0.21 (rustls 0.22) and reqwest 0.11 (rustls 0.21),
# which transitively pull the vulnerable rustls-webpki 0.101/0.102. There is no fix until
# serenity bumps tungstenite upstream — tracked at:
# https://github.com/serenity-rs/serenity/issues/3557
serenity = { version = "^0.12", default-features = false, features = [
    "client",
    "gateway",
    "rustls_backend",
    "model",
] }
sqlx = { version = "^0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "sqlite",
    "macros",
    "chrono",
    "uuid",
    "json",
    "migrate",
] }


memmap2 = { version = "^0.9" }
tokio-util = { version = "^0.7", features = ["io"] }
portable-pty = "^0.9"
samply-symbols = { version = "^0.24.1", features = ["send_futures"] }
symbolic-common = "^13"
symbolic-demangle = { version = "^13", features = ["swift", "cpp"] }

tracing = { version = "^0.1", features = ["attributes"] }
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }
tracing-opentelemetry = "^0.33"
opentelemetry = { version = "^0.32" }
opentelemetry_sdk = { version = "^0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "^0.32", features = ["grpc-tonic"] }
opentelemetry-semantic-conventions = "^0.32"

axum = { version = "^0.8", features = ["http2", "macros", "multipart", "ws"] }
axum-macros = "^0.5"
tower = "^0.5"
tower-service = "^0.3"
tower-http = { version = "^0.7", features = [
    "cors",
    "trace",
    "catch-panic",
    "request-id",
    "fs",
    "util",
    "validate-request",
] }

[dev-dependencies]
tempfile = "^3"
